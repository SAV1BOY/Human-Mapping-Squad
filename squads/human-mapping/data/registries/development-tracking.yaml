# Registry: Development Tracking
# Rastreamento da execução de planos de desenvolvimento gerados pelo squad.
# Monitora se as ações recomendadas foram implementadas e quais resultados
# produziram, fechando o ciclo de feedback do mapeamento.
#
# Schema:
#   - plan_id: identificador do plano de desenvolvimento (string, formato: DEV-YYYY-NNNN)
#   - session_id: sessão que originou o plano (string, formato: HMS-YYYY-NNNN)
#   - respondent: identificador anonimizado do respondente (string)
#   - created_date: data de criação do plano (string, formato: YYYY-MM-DD)
#   - total_actions: número total de ações recomendadas no plano (integer)
#   - actions_completed: número de ações efetivamente completadas (integer)
#   - completion_rate: taxa de conclusão das ações (float, 0.0 a 1.0)
#   - outcomes: resultados observados após implementação (list of strings)
#   - follow_up_dates: datas de acompanhamento realizadas (list of strings, formato: YYYY-MM-DD)
#   - status: estado atual do plano — active | completed | abandoned | stalled (string)
#   - effectiveness_rating: avaliação da efetividade do plano (integer, 1 a 5, opcional)
#   - notes: observações sobre progresso ou obstáculos (string, opcional)

# Validation Rules:
#   - plan_id: obrigatório, formato "DEV-YYYY-NNNN", único no registro
#   - session_id: obrigatório, formato "HMS-YYYY-NNNN", deve existir em session-index.yaml
#   - created_date: obrigatório, formato YYYY-MM-DD
#   - total_actions: obrigatório, inteiro >= 1
#   - actions_completed: obrigatório, inteiro >= 0, não pode exceder total_actions
#   - completion_rate: obrigatório, float entre 0.0 e 1.0, deve ser = actions_completed / total_actions
#   - status: obrigatório, valores aceitos: active | completed | abandoned | stalled
#   - effectiveness_rating: opcional, inteiro de 1 a 5 (preenchido apenas quando status = completed)
#
# Usage:
#   Criado pelo Development Advisor ao final de uma sessão com plano de ação.
#   Atualizado em follow-ups agendados (30, 60, 90 dias).
#   Consultado para medir ROI real do mapeamento e calibrar recomendações futuras.

entries:
  - plan_id: "DEV-2026-0001"
    session_id: "HMS-2026-0001"
    respondent: "R-0001"
    created_date: "2026-02-20"
    total_actions: 5
    actions_completed: 3
    completion_rate: 0.60
    outcomes:
      - "Implementou rotina semanal de 1:1s com foco em desenvolvimento (ação 1) — equipe reportou maior clareza de expectativas"
      - "Delegou 2 projetos operacionais para liberar tempo estratégico (ação 3) — reduziu carga em 8h/semana"
      - "Iniciou journaling diário para desenvolver assertividade (ação 4) — percebe mais facilidade em dar feedback direto"
    follow_up_dates:
      - "2026-03-20"
    status: "active"
    effectiveness_rating: null
    notes: >
      Follow-up de 30 dias realizado em 2026-03-20. Ações 1, 3 e 4 implementadas.
      Ação 2 (curso de comunicação não-violenta) adiada por agenda. Ação 5
      (mentoria com líder sênior) em negociação. Próximo follow-up: 2026-04-20.

    motivo_mudanca: "Avaliação inicial via proxy-inference durante sessão deep"
    evidencia: "Respostas consistentes em 8 perguntas sobre socialização e energia interpessoal"
    tipo_evento: "avaliação_inicial"

  - id: "CH-0002"
    persona_id: "PER-0001"
    data: 2026-02-18
    dimensao: "Extroversão"

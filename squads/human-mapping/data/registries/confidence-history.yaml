# Registry: Confidence History
# Histórico de evolução dos níveis de confiança das avaliações ao longo
# do tempo. Permite rastrear como a confiança muda com novas evidências,
# reavaliações e resolução de contradições.
#
# Schema:
#   - id: identificador único do registro (string)
#   - persona_id: referência à persona (string)
#   - data: data do registro (date)
#   - dimensao: dimensão avaliada (ex: extroversão, dominância) (string)
#   - framework: framework utilizado (string)
#   - confianca_anterior: nível anterior 0.0 a 1.0 (float)
#   - confianca_atual: nível atual 0.0 a 1.0 (float)
#   - motivo_mudanca: razão da alteração (string)
#   - evidencia: evidência que suportou a mudança (string)
#   - tipo_evento: avaliação_inicial | reavaliação | nova_evidência | resolução_contradição (string)

# Validation Rules:
#   - id: obrigatório, formato "CH-NNNN", único no registro
#   - persona_id: obrigatório, referência válida a persona-registry (formato "PER-NNNN")
#   - data: obrigatório, formato YYYY-MM-DD
#   - dimensao: obrigatório, string não vazia
#   - framework: obrigatório, nome de framework reconhecido
#   - confianca_anterior / confianca_atual: obrigatório, float entre 0.0 e 1.0
#   - tipo_evento: obrigatório, valores aceitos: avaliação_inicial | reavaliação | nova_evidência | resolução_contradição
#
# Usage:
#   Escrito pelos agentes analistas ao calcular ou recalcular confiança de uma dimensão.
#   Consultado pelo Integration Specialist para rastrear evolução e justificar scores finais.
#   Usado em retrospectivas para entender quais tipos de evidência mais elevam confiança.

entries:

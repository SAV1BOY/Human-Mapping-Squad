# Registry: Persona Registry
# Registro central de todas as personas mapeadas pelo Human Mapping Squad.
# Cada entrada representa um indivíduo com seu perfil consolidado,
# incluindo referências aos frameworks utilizados e níveis de confiança.
#
# Schema:
#   - id: identificador único da persona (string)
#   - nome: nome ou pseudônimo do indivíduo (string)
#   - data_criacao: data de criação do registro (date)
#   - data_atualizacao: última atualização (date)
#   - status: ativo | arquivado | em_andamento (string)
#   - projeto_origem: referência ao projeto que gerou o perfil (string)
#   - frameworks_utilizados: lista de frameworks aplicados (list)
#   - nivel_confianca_geral: 0.0 a 1.0 (float)
#   - perfil_resumo: descrição breve do perfil (string)
#   - tags: etiquetas para categorização (list)
#   - notas: observações adicionais (string)

# Validation Rules:
#   - id: obrigatório, formato "PER-NNNN", único no registro
#   - nome: obrigatório, string não vazia
#   - data_criacao / data_atualizacao: obrigatório, formato YYYY-MM-DD
#   - status: obrigatório, valores aceitos: ativo | arquivado | em_andamento
#   - nivel_confianca_geral: obrigatório, float entre 0.0 e 1.0
#   - frameworks_utilizados: obrigatório, lista com pelo menos 1 framework
#   - tags: obrigatório, lista com pelo menos 1 tag
#
# Usage:
#   Escrito pelo Orchestrator Agent ao iniciar um novo mapeamento (status: em_andamento)
#   e atualizado pelo Integration Specialist ao consolidar o perfil final (status: ativo).
#   Consultado por todos os agentes para verificar estado e histórico da persona.


# Registry: Framework Effectiveness
# Rastreamento da efetividade de cada framework de avaliação utilizado pelo squad.
# Permite identificar quais frameworks produzem insights mais confiáveis e quais
# geram mais contradições ou resultados questionáveis.
#
# Schema:
#   - framework_id: identificador do framework (string, ex: big-five, mbti, disc)
#   - times_used: número total de sessões em que o framework foi aplicado (integer)
#   - avg_confidence: confiança média dos resultados produzidos pelo framework (float, 0.0 a 1.0)
#   - conflicts_generated: número de conflitos/contradições gerados com outros frameworks (integer)
#   - avg_respondent_recognition: taxa média de reconhecimento do respondente com o resultado (float, 0.0 a 1.0)
#   - best_paired_with: frameworks com os quais produz melhor sinergia (list of strings)
#   - known_limitations_observed: limitações observadas na prática (list of strings)
#   - last_used: data da última utilização (string, formato: YYYY-MM-DD)

# Validation Rules:
#   - framework_id: obrigatório, deve corresponder a um id em framework-registry.yaml
#   - times_used: obrigatório, inteiro >= 0
#   - avg_confidence: obrigatório, float entre 0.0 e 1.0
#   - conflicts_generated: obrigatório, inteiro >= 0
#   - avg_respondent_recognition: obrigatório, float entre 0.0 e 1.0
#   - best_paired_with: obrigatório, lista de framework_ids válidos
#   - last_used: obrigatório, formato YYYY-MM-DD
#
# Usage:
#   Atualizado automaticamente pelo Quality Auditor ao final de cada sessão.
#   Revisado mensalmente pelo Meta-Analyst para ajustar recomendações de uso.
#   Consultado pelo Orchestrator ao decidir quais frameworks incluir em uma sessão.

entries:
  - framework_id: "big-five"
    times_used: 47
    avg_confidence: 0.78
    conflicts_generated: 8
    avg_respondent_recognition: 0.81
    best_paired_with:
      - "hexaco"
      - "mbti"
      - "enneagram"
    known_limitations_observed:
      - "faceta assertividade frequentemente contradiz tipo MBTI E/I"
      - "auto-relato de neuroticismo tende a ser subestimado em contextos profissionais"
      - "abertura a experiências confundida com inteligência em respondentes acadêmicos"
    last_used: "2026-03-10"

  - framework_id: "enneagram"
    times_used: 32
    avg_confidence: 0.65

# Registry: Respondent Feedback
# Rastreamento do feedback dos respondentes sobre a qualidade e utilidade
# dos mapeamentos realizados. Essencial para calibrar a metodologia e
# detectar viés de Efeito Barnum.
#
# Schema:
#   - session_id: identificador da sessão avaliada (string, formato: HMS-YYYY-NNNN)
#   - respondent: identificador anonimizado do respondente (string)
#   - date: data do feedback (string, formato: YYYY-MM-DD)
#   - accuracy_rating: quão preciso o respondente considerou o mapeamento (integer, 1 a 5)
#   - usefulness_rating: quão útil o respondente considerou o mapeamento (integer, 1 a 5)
#   - surprise_factor: quanto o mapeamento revelou algo novo vs. confirmou o já sabido (integer, 1 a 5)
#   - specific_insights_cited: insights específicos que o respondente destacou (list of strings)
#   - disagreements_cited: pontos com os quais o respondente discordou (list of strings)
#   - comments: comentários livres do respondente (string, opcional)
#   - barnum_check: resultado do teste anti-Barnum — pass | fail | not_applied (string)

# Validation Rules:
#   - session_id: obrigatório, formato "HMS-YYYY-NNNN", deve existir em session-index.yaml
#   - respondent: obrigatório, identificador anonimizado (ex: "R-0001")
#   - date: obrigatório, formato YYYY-MM-DD
#   - accuracy_rating: obrigatório, inteiro de 1 a 5
#   - usefulness_rating: obrigatório, inteiro de 1 a 5
#   - surprise_factor: obrigatório, inteiro de 1 a 5 (1=tudo já sabido, 5=muito surpreendente)
#   - barnum_check: obrigatório, valores aceitos: pass | fail | not_applied
#
# Usage:
#   Coletado pelo Orchestrator Agent ao final da devolutiva, após apresentar
#   resultados ao respondente. O teste anti-Barnum é aplicado automaticamente
#   (perfil real vs. perfil placebo). Consultado para calibrar metodologia.

entries:
  - session_id: "HMS-2026-0001"
    respondent: "R-0001"
    date: "2026-02-20"
    accuracy_rating: 4
    usefulness_rating: 5
    surprise_factor: 3
    specific_insights_cited:
      - "A distinção entre extroversão social e extroversão cognitiva explicou muito sobre minha forma de liderar"
      - "Nunca tinha percebido que meu Tipo 2 (Enneagram) influencia meu estilo de gestão de conflitos"
      - "O CliftonStrengths Empatia + Estratégico como combinação me fez entender decisões que tomo intuitivamente"
    disagreements_cited:
      - "Não me reconheço na faceta 'modéstia' alta do Big Five — acredito que sou mais assertiva do que o resultado sugere"
    comments: >
      O mapeamento foi extremamente útil para meu plano de desenvolvimento
      como líder. A devolutiva narrativa foi mais valiosa que relatórios
      tipológicos que já recebi. Recomendo fortemente.
    barnum_check: "pass"

  - session_id: "HMS-2026-0002"
    respondent: "R-0002"
    date: "2026-03-12"
    accuracy_rating: 3
    usefulness_rating: 3
    surprise_factor: 2
    specific_insights_cited:
      - "O perfil DC no DISC faz sentido com minha forma de trabalhar em projetos técnicos"
    disagreements_cited:
      - "A conscienciosidade alta no Big Five não me parece correta — sou bastante desorganizado no dia a dia"
      - "Não entendi como chegaram ao resultado de amabilidade moderada sem me conhecer pessoalmente"
    comments: >
      Entendo que o mapeamento está incompleto, mas alguns resultados parecem
      genéricos demais. Espero que a sessão presencial traga mais precisão.
    barnum_check: "not_applied"
